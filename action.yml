name: Limbowatch
description: Check dependencies against security advisories in limbo, not yet in the databases scanners read.
author: Limbowatch
branding:
  icon: clock
  color: orange
inputs:
  path:
    description: Project directory to scan.
    default: "."
  fail-on:
    description: Fail for findings at or above this severity (critical, high, medium, low, none).
    default: low
  fail-on-unknown:
    description: Also fail for findings with no severity.
    default: "true"
  allow-failure:
    description: >-
      "true" to pass the step with a warning when findings meet fail-on. A scan that couldn't run (exit code 2)
      still fails.
    default: "false"
  sarif:
    description: Write SARIF to this file (for GitHub code scanning); empty for none.
    default: ""
  annotations:
    description: >-
      Annotate each finding on its lockfile line in the pull request ("true" or "false"). Works without code
      scanning; GitHub shows at most 10 annotations of each level per step.
    default: "true"
  reports:
    description: >-
      Directory for the full reports (report.json, report.md, report.html, report.sarif, report.csv,
      cyclonedx.json); empty for none. Upload it with actions/upload-artifact to keep it.
    default: limbowatch-report
  issues:
    description: >-
      "gitea" to open and update issues in this repo (Gitea or Forgejo) from the default branch or a
      schedule. Needs a LIMBOWATCH_ISSUES_TOKEN secret. Never opens issues in a public repo.
    default: ""
  issues-token:
    description: Token that can write issues here (pass a secret).
    default: ""
  extra-args:
    description: More `limbowatch scan` options.
    default: ""
  install:
    description: >-
      How to run Limbowatch. "image": the Limbowatch image (Linux with Docker). "python": install it with pip
      (needs Python 3.12; macOS, Windows, or a job that runs in a container). "auto": the image where it works.
    default: auto
  image:
    description: The Limbowatch image, pinned by digest (built and attested by the Limbowatch repository).
    default: ghcr.io/limbowatch/limbowatch:0.1.0a2@sha256:7ef6857b1c5c8f9109be08a12b183ac41aec540bbe35af4b80487a0cb658ebf4
  osv-scanner-version:
    description: OSV-Scanner release to download with install "python" (checked against its SHA-256 sums).
    default: 2.7.0
  limbowatch-source:
    description: Where `<ref>.tar.gz` source archives are served, for install "python".
    default: https://github.com/limbowatch/limbowatch/archive
  limbowatch-ref:
    description: Limbowatch release tag to install with install "python".
    default: v0.1.0a2
outputs:
  findings:
    description: Findings that aren't accepted (ignored).
    value: ${{ steps.scan.outputs.findings }}
  failing:
    description: Findings at or above fail-on.
    value: ${{ steps.scan.outputs.failing }}
  failed:
    description: '"true" if the scan failed the fail-on gate.'
    value: ${{ steps.scan.outputs.failed }}
  report:
    description: Path of the JSON report (schema_version 1), when reports is set.
    value: ${{ steps.scan.outputs.report }}
runs:
  using: composite
  steps:
    - name: Set up Limbowatch
      shell: bash
      env:
        LW_INSTALL: ${{ inputs.install }}
        LW_IMAGE: ${{ inputs.image }}
        LW_OSV_VERSION: ${{ inputs.osv-scanner-version }}
        LW_SOURCE: ${{ inputs.limbowatch-source }}
        LW_REF: ${{ inputs.limbowatch-ref }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"  # not github.action_path: that's the host path in container jobs
    - name: Scan
      id: scan
      shell: bash
      env:
        LW_PATH: ${{ inputs.path }}
        LW_FAIL_ON: ${{ inputs.fail-on }}
        LW_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        LW_ALLOW_FAILURE: ${{ inputs.allow-failure }}
        LW_IMAGE: ${{ inputs.image }}
        LW_SARIF: ${{ inputs.sarif }}
        LW_ANNOTATIONS: ${{ inputs.annotations }}
        LW_REPORTS: ${{ inputs.reports }}
        LW_ISSUES: ${{ inputs.issues }}
        LW_EXTRA: ${{ inputs.extra-args }}
        LIMBOWATCH_ISSUES_TOKEN: ${{ inputs.issues-token }}
        LW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$GITHUB_ACTION_PATH/scan.sh"
